services:
  mysql:
    image: mysql:8.0
    container_name: kchill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: kchill_cafe
      MYSQL_USER: kchill
      MYSQL_PASSWORD: kchill_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: kchill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
